# Generate the Xcode project:  brew install xcodegen && xcodegen
# Re-run after adding or removing files. HHIL.xcodeproj is generated, not edited by hand.
name: HHIL
options:
  bundleIdPrefix: com.ethanpany
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    from: 0.7.0
targets:
  HHIL:
    type: application
    platform: iOS
    sources:
      - path: HHIL
        excludes:
          - "Resources/Fonts/*.txt"
    dependencies:
      - package: ConvexMobile
    scheme:
      testTargets:
        - HHILUITests
    info:
      path: HHIL/Info.plist
      properties:
        CFBundleDisplayName: HHIL
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSNearbyInteractionUsageDescription: Your badge lights up when someone you should meet is close by.
        NSMicrophoneUsageDescription: Records conversations so your agent can send you a summary.
        NSSpeechRecognitionUsageDescription: Transcribes conversations on your phone for your summary.
        NSMotionUsageDescription: Your avatar notices when you walk, run or ride, and bounces along with you.
        LSApplicationQueriesSchemes: [sms]
        # Standard encryption only (HTTPS), so no export compliance documents
        ITSAppUsesNonExemptEncryption: false
        # Light only (the design has no dark variant)
        UIUserInterfaceStyle: Light
        # General Sans, fetched by scripts/fetch-fonts.sh (not in git, see the license)
        UIAppFonts:
          - GeneralSans-Regular.otf
          - GeneralSans-Medium.otf
          - GeneralSans-Semibold.otf
          - GeneralSans-Bold.otf
        AgentPhone: $(AGENT_PHONE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanpany.hhil
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Convex Rust library ships no Intel simulator slice
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        # iPhone Duo hinge API (Platform/Fold.swift): the iOS 27.0 beta SDK
        # (27A5218g) has no hinge symbols yet, so HINGE_API stays off. Turn it on
        # per SDK here, e.g. "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27.1*]",
        # once an SDK ships the API.
  # Screenshot walkthrough on the mock backend (CI: the screenshots job)
  HHILUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HHILUITests
    dependencies:
      - target: HHIL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethanpany.hhil.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: HHIL
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
