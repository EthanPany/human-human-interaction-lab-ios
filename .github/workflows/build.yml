name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          ./scripts/fetch-fonts.sh || echo "fonts unavailable, building with system font"
          xcodegen
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project HHIL.xcodeproj -scheme HHIL \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|never)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
